openapi: 3.0.3
info:
  title: NimbusWiz API
  version: '1.0'
  description: |
    A design-spec REST API for NimbusWiz. The prototype has no live backend:
    the endpoints below are written as if I were specing them for an
    engineering team.

    All requests would be authenticated with a Bearer token. Include the API
    key in the `Authorization` header of every request:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    Two endpoints are documented as samples: register a system and read
    system metrics. Other resources (scans, deployments, alerts) would
    follow the same conventions but aren't written out.
  contact:
    name: NimbusWiz Developer Support
    url: https://nimbuswiz-demo.vercel.app
servers:
  - url: https://api.nimbuswiz.io/v1
    description: Design example (no live endpoint)
security:
  - BearerAuth: []
tags:
  - name: Fleet
    description: |
      A **System** is the primary resource in NimbusWiz. Each system represents
      a registered legacy infrastructure unit tracked through the assessment,
      modernization, and deployment lifecycle.

      Systems have a stable ID (`n2k-[name]-[number]`), a `status` that
      advances through the lifecycle, and scores that reflect current health.
  - name: Monitoring
    description: |
      **Monitoring** endpoints provide real-time and historical health data for
      systems post-deployment. Metrics include stability index, responsiveness
      score, and network interaction, each with trend direction and time-series data.
paths:
  /fleet:
    post:
      operationId: registerSystem
      summary: Register a system
      description: |
        Registers a new system in your NimbusWiz organization.
        The system ID must be unique and match the format `n2k-[name]-[number]`.

        Requires `fleet:write` scope.
      tags:
        - Fleet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSystemRequest'
            example:
              id: n2k-beta-002
              name: Beta Fleet Secondary
              certification_type: class_b
              upgrade_profile: stable
              flight_profile: stability_focused
      responses:
        '201':
          description: System registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
              example:
                id: n2k-beta-002
                name: Beta Fleet Secondary
                status: registered
                stability_score: null
                upgrade_profile: stable
                flight_profile: stability_focused
                registered_at: '2026-04-10T11:22:00Z'
        '400':
          description: Missing required field or invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: missing_field
                message: The 'id' field is required.
                detail:
                  field: id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A system with this ID already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate_system_id
                message: A system with ID n2k-beta-002 already exists.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://api.nimbuswiz.io/v1/fleet" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "id": "n2k-beta-002",
                "name": "Beta Fleet Secondary",
                "certification_type": "class_b",
                "upgrade_profile": "stable",
                "flight_profile": "stability_focused"
              }'
        - lang: javascript
          label: JavaScript
          source: |
            const response = await fetch('https://api.nimbuswiz.io/v1/fleet', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer YOUR_API_KEY',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                id: 'n2k-beta-002',
                name: 'Beta Fleet Secondary',
                certification_type: 'class_b',
                upgrade_profile: 'stable',
                flight_profile: 'stability_focused',
              }),
            });
            const system = await response.json();
        - lang: python
          label: Python
          source: |
            import requests

            response = requests.post(
                'https://api.nimbuswiz.io/v1/fleet',
                headers={'Authorization': 'Bearer YOUR_API_KEY'},
                json={
                    'id': 'n2k-beta-002',
                    'name': 'Beta Fleet Secondary',
                    'certification_type': 'class_b',
                    'upgrade_profile': 'stable',
                    'flight_profile': 'stability_focused',
                }
            )
            system = response.json()
  /fleet/{system_id}/metrics:
    get:
      operationId: getSystemMetrics
      summary: Get system metrics
      description: |
        Returns current health metrics and time-series data for a system.
        Each metric includes the current value, trend direction, and a data
        series for the selected time range.

        Requires `fleet:read` scope.
      tags:
        - Monitoring
      parameters:
        - name: system_id
          in: path
          required: true
          description: The unique system ID.
          schema:
            type: string
          example: n2k-alpha-001
        - name: range
          in: query
          description: Time range for series data.
          required: false
          schema:
            type: string
            enum:
              - 1h
              - 24h
              - 7d
              - 30d
            default: 24h
          example: 7d
      responses:
        '200':
          description: System metrics and time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                system_id: n2k-alpha-001
                range: 7d
                metrics:
                  stability_index:
                    current: 86
                    trend: stable
                    series:
                      - timestamp: '2026-04-03T00:00:00Z'
                        value: 84
                      - timestamp: '2026-04-10T00:00:00Z'
                        value: 86
                  responsiveness_score:
                    current: 79
                    trend: up
                    series:
                      - timestamp: '2026-04-03T00:00:00Z'
                        value: 74
                      - timestamp: '2026-04-10T00:00:00Z'
                        value: 79
                  network_interaction:
                    current: 74
                    trend: stable
                    series:
                      - timestamp: '2026-04-03T00:00:00Z'
                        value: 73
                      - timestamp: '2026-04-10T00:00:00Z'
                        value: 74
                retrieved_at: '2026-04-10T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://api.nimbuswiz.io/v1/fleet/n2k-alpha-001/metrics?range=7d" \
              -H "Authorization: Bearer YOUR_API_KEY"
        - lang: javascript
          label: JavaScript
          source: |
            const response = await fetch(
              'https://api.nimbuswiz.io/v1/fleet/n2k-alpha-001/metrics?range=7d',
              { headers: { Authorization: 'Bearer YOUR_API_KEY' } }
            );
            const metrics = await response.json();
        - lang: python
          label: Python
          source: |
            import requests

            response = requests.get(
                'https://api.nimbuswiz.io/v1/fleet/n2k-alpha-001/metrics',
                params={'range': '7d'},
                headers={'Authorization': 'Bearer YOUR_API_KEY'}
            )
            metrics = response.json()
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key generated in Developer Hub > API Keys inside NimbusWiz. Include as Authorization: Bearer YOUR_API_KEY on every request.
  schemas:
    System:
      type: object
      description: A registered system in NimbusWiz.
      properties:
        id:
          type: string
          example: n2k-alpha-001
          description: |
            Unique system identifier. Format `n2k-[name]-[number]`. Immutable after registration.
        name:
          type: string
          example: Alpha Fleet Primary
          description: Human-readable system name.
        status:
          type: string
          enum:
            - registered
            - scanning
            - assessment_complete
            - modernizing
            - deployed
            - monitoring
          example: monitoring
          description: Current lifecycle stage of the system.
        stability_score:
          type: integer
          nullable: true
          example: 86
          description: Composite health score (0-100). `null` until first scan completes.
        responsiveness_score:
          type: integer
          nullable: true
          example: 79
          description: Response time and throughput score (0-100).
        network_interaction:
          type: integer
          nullable: true
          example: 74
          description: Network reliability and latency score (0-100).
        flight_profile:
          type: string
          nullable: true
          enum:
            - performance_focused
            - stability_focused
            - efficiency_focused
          example: performance_focused
          description: Operational priority that influences Advisor recommendations.
        upgrade_profile:
          type: string
          nullable: true
          enum:
            - stable
            - performance
            - extended
          example: performance
          description: Upgrade strategy currently applied to this system.
        certification_type:
          type: string
          nullable: true
          enum:
            - class_a
            - class_b
            - class_c
          example: class_b
          description: Certification class set at registration.
        last_upgrade:
          type: string
          format: date-time
          nullable: true
          example: '2026-03-15T09:41:00Z'
          description: ISO 8601 timestamp of the most recent completed deployment.
        registered_at:
          type: string
          format: date-time
          example: '2026-01-10T08:00:00Z'
          description: ISO 8601 timestamp when the system was registered.
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-10T14:05:00Z'
          description: ISO 8601 timestamp of the most recent metadata update.
    RegisterSystemRequest:
      type: object
      required:
        - id
        - name
        - certification_type
      properties:
        id:
          type: string
          example: n2k-beta-002
          description: Unique system ID. Must match `n2k-[name]-[number]` format.
        name:
          type: string
          example: Beta Fleet Secondary
          description: Human-readable system name.
        certification_type:
          type: string
          enum:
            - class_a
            - class_b
            - class_c
          example: class_b
          description: Certification class. Cannot be changed after registration.
        upgrade_profile:
          type: string
          enum:
            - stable
            - performance
            - extended
          example: stable
          description: Initial upgrade profile. Defaults to `stable`.
        flight_profile:
          type: string
          enum:
            - performance_focused
            - stability_focused
            - efficiency_focused
          example: stability_focused
          description: Operational priority for Advisor recommendations.
        notes:
          type: string
          description: Optional free-text notes about this system.
    MetricsResponse:
      type: object
      properties:
        system_id:
          type: string
          example: n2k-alpha-001
        range:
          type: string
          example: 7d
          description: The time range used for series data.
        metrics:
          type: object
          properties:
            stability_index:
              $ref: '#/components/schemas/MetricSeries'
            responsiveness_score:
              $ref: '#/components/schemas/MetricSeries'
            network_interaction:
              $ref: '#/components/schemas/MetricSeries'
        retrieved_at:
          type: string
          format: date-time
          example: '2026-04-10T16:00:00Z'
    MetricSeries:
      type: object
      properties:
        current:
          type: integer
          example: 86
          description: Most recent value.
        trend:
          type: string
          enum:
            - up
            - down
            - stable
          example: stable
          description: |
            Direction of change over the selected range.

            | Value | Meaning |
            |-------|---------|
            | `up` | Metric has improved |
            | `down` | Metric has declined |
            | `stable` | Within +/- 3 points |
        series:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                example: '2026-04-03T00:00:00Z'
              value:
                type: integer
                example: 84
    Error:
      type: object
      description: Standard error response returned for all 4xx and 5xx responses.
      properties:
        error:
          type: string
          example: not_found
          description: Machine-readable error code.
        message:
          type: string
          example: System n2k-unknown-999 does not exist.
          description: Human-readable description of the error.
        detail:
          type: object
          nullable: true
          description: |
            Additional context such as field names, values, or IDs involved. Not present on all errors.
          example:
            system_id: n2k-unknown-999
  responses:
    Unauthorized:
      description: Missing, invalid, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: API key is invalid or has been revoked.
    Forbidden:
      description: Valid API key, but insufficient scope for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_scope
            message: This endpoint requires the 'fleet:write' scope.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: System n2k-unknown-999 does not exist.
